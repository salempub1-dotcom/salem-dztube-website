<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1040" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc"><title id="title">مسار الطلب عند الدفع عند الاستلام</title><desc id="desc">مراحل الطلب من الاستلام إلى تحصيل المستحقات؛ تُتابع الإلغاءات والمرتجعات منفصلة.</desc><g font-family="Tahoma, Arial, sans-serif"><rect x="1" y="1" width="718" height="1038" rx="22" fill="#f6f7f9" stroke="#e8e8eb" stroke-width="2"/><text x="360" y="76" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="34" font-weight="700" fill="#19191d">مسار الطلب عند الدفع عند الاستلام</text><rect x="70" y="120" width="580" height="112" rx="22" fill="#fff" stroke="#e8e8eb" stroke-width="2"/><text x="360" y="163" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="35" font-weight="700" fill="#b80f1f">طلب جديد</text><text x="360" y="202" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="27" font-weight="500" fill="#19191d">وصل الطلب إلى المتجر</text><path d="M360 237v20m-8-7 8 8 8-8" fill="none" stroke="#b80f1f" stroke-width="3"/><rect x="70" y="265" width="580" height="112" rx="22" fill="#fff" stroke="#e8e8eb" stroke-width="2"/><text x="360" y="308" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="35" font-weight="700" fill="#b80f1f">طلب مؤكد</text><text x="360" y="347" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="27" font-weight="500" fill="#19191d">راجع التفاصيل مع الزبون</text><path d="M360 382v20m-8-7 8 8 8-8" fill="none" stroke="#b80f1f" stroke-width="3"/><rect x="70" y="410" width="580" height="112" rx="22" fill="#fff" stroke="#e8e8eb" stroke-width="2"/><text x="360" y="453" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="35" font-weight="700" fill="#b80f1f">شحنة مرسلة</text><text x="360" y="492" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="27" font-weight="500" fill="#19191d">سجّل مرجع الشحنة</text><path d="M360 527v20m-8-7 8 8 8-8" fill="none" stroke="#b80f1f" stroke-width="3"/><rect x="70" y="555" width="580" height="112" rx="22" fill="#fff" stroke="#e8e8eb" stroke-width="2"/><text x="360" y="598" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="35" font-weight="700" fill="#b80f1f">طلب مسلّم</text><text x="360" y="637" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="27" font-weight="500" fill="#19191d">تحقّق من حالة التسليم</text><path d="M360 672v20m-8-7 8 8 8-8" fill="none" stroke="#b80f1f" stroke-width="3"/><rect x="70" y="700" width="580" height="112" rx="22" fill="#fff" stroke="#e8e8eb" stroke-width="2"/><text x="360" y="743" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="35" font-weight="700" fill="#b80f1f">مستحقات محصّلة</text><text x="360" y="782" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="27" font-weight="500" fill="#19191d">طابق التحويل مع الشحنات</text><text x="360" y="906" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="29" font-weight="700" fill="#19191d">التسليم والتحصيل مرحلتان منفصلتان</text><text x="360" y="949" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="25" font-weight="500" fill="#63636c">مسار مبسّط للطلبات المكتملة</text><text x="360" y="1004" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="23" font-weight="500" fill="#63636c">SalemDZTube</text></g></svg>