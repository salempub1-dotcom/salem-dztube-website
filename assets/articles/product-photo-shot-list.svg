<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1040" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc"><title id="title">صور تشرح المنتج</title><desc id="desc">صور تشرح المنتج</desc><g font-family="Tahoma, Arial, sans-serif"><rect x="1" y="1" width="718" height="1038" rx="22" fill="#f6f7f9" stroke="#e8e8eb" stroke-width="2"/><text x="360" y="76" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="42" font-weight="700" fill="#19191d">صور تشرح المنتج</text><rect x="50" y="122" width="620" height="112" rx="22" fill="#fff" stroke="#e8e8eb" stroke-width="2"/><text x="360" y="165" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="35" font-weight="700" fill="#b80f1f">صورة عامة</text><text x="360" y="205" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="26" font-weight="500" fill="#19191d">أظهر النسخة المعروضة بوضوح</text><rect x="50" y="267" width="620" height="112" rx="22" fill="#fff" stroke="#e8e8eb" stroke-width="2"/><text x="360" y="310" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="35" font-weight="700" fill="#b80f1f">زاوية أخرى</text><text x="360" y="350" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="26" font-weight="500" fill="#19191d">اكشف الحواف والجانب أو الخلف</text><rect x="50" y="412" width="620" height="112" rx="22" fill="#fff" stroke="#e8e8eb" stroke-width="2"/><text x="360" y="455" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="35" font-weight="700" fill="#b80f1f">تفصيل مهم</text><text x="360" y="495" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="26" font-weight="500" fill="#19191d">صوّر الإغلاق أو الأقسام أو الخامة</text><rect x="50" y="557" width="620" height="112" rx="22" fill="#fff" stroke="#e8e8eb" stroke-width="2"/><text x="360" y="600" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="35" font-weight="700" fill="#b80f1f">توضيح المقاس</text><text x="360" y="640" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="26" font-weight="500" fill="#19191d">قياس صحيح أو مرجع مفهوم للحجم</text><rect x="50" y="702" width="620" height="112" rx="22" fill="#fff" stroke="#e8e8eb" stroke-width="2"/><text x="360" y="745" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="35" font-weight="700" fill="#b80f1f">محتويات العلبة</text><text x="360" y="785" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="26" font-weight="500" fill="#19191d">اعرض ما سيتسلمه المشتري فعلاً</text><text x="360" y="925" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="27" font-weight="500" fill="#63636c">اختبر وضوح الصور على الهاتف</text><text x="360" y="1004" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="23" font-weight="500" fill="#63636c">SalemDZTube</text></g></svg>