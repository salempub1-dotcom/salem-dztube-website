<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1040" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc"><title id="title">من المبالغة إلى الوصف الدقيق</title><desc id="desc">مقارنة بين مزاعم غير مثبتة ووصف يعتمد على مواصفات معلومة لمنظم مكتب افتراضي.</desc><g font-family="Tahoma, Arial, sans-serif"><rect x="1" y="1" width="718" height="1038" rx="22" fill="#f6f7f9" stroke="#e8e8eb" stroke-width="2"/><text x="360" y="76" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="42" font-weight="700" fill="#19191d">من المبالغة إلى الوصف الدقيق</text><rect x="45" y="122" width="630" height="340" rx="22" fill="#fff1f2" stroke="#d7192c" stroke-width="2"/><text x="360" y="178" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="35" font-weight="700" fill="#b80f1f">ادعاءات غير موثّقة</text><text x="360" y="249" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="32" font-weight="500" fill="#19191d">«الأفضل في السوق»</text><text x="360" y="313" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="32" font-weight="500" fill="#19191d">«غير قابل للكسر»</text><text x="360" y="377" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="32" font-weight="500" fill="#19191d">«يضاعف إنتاجيتك»</text><text x="360" y="429" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="27" font-weight="500" fill="#b80f1f">لا تنشر ادعاءً بلا دليل</text><rect x="45" y="502" width="630" height="350" rx="22" fill="#fff" stroke="#e8e8eb" stroke-width="2"/><text x="360" y="558" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="35" font-weight="700" fill="#19191d">وصف مبني على الحقائق</text><text x="360" y="630" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="32" font-weight="500" fill="#19191d">منظّم مكتب بلاستيكي</text><text x="360" y="696" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="32" font-weight="500" fill="#19191d">ثلاثة أقسام للأدوات الصغيرة</text><text x="360" y="762" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="32" font-weight="500" fill="#19191d">الأبعاد: 20 × 10 × 9 سم</text><text x="360" y="820" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="27" font-weight="500" fill="#63636c">قارن المقاس بمساحة مكتبك</text><text x="360" y="913" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="30" font-weight="700" fill="#19191d">مثال تعليمي على الصياغة</text><text x="360" y="956" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="25" font-weight="500" fill="#63636c">ليس منتجاً معروضاً للبيع</text><text x="360" y="1004" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-size="23" font-weight="500" fill="#63636c">SalemDZTube</text></g></svg>