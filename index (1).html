<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>إدارة المقالات | SalemDZTube</title><link rel="icon" href="../assets/favicon.svg"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="admin.css"></head><body>
<header class="site-header"><div class="wrap nav-inner"><a class="brand" href="/">Salem<span class="red">DZ</span>Tube</a><nav class="subpage-nav"><a href="/articles/">المقالات</a><a href="/">الرئيسية</a></nav></div></header>
<main class="wrap editor"><h1>لوحة إدارة المقالات</h1><p>إضافة وتعديل المقالات بموافقة مسؤول الموقع فقط.</p><p id="notice" role="status" class="notice" aria-live="polite"></p>
<section id="login" class="panel" hidden><h2>تسجيل الدخول</h2><form id="signin"><label>البريد الإلكتروني<input id="email" type="email" autocomplete="username" required></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label><button class="button" type="submit">دخول</button></form></section>
<section id="dashboard" hidden><div class="toolbar"><h2>المقالات</h2><button class="button button-small" id="signout">تسجيل الخروج</button></div><div class="columns"><aside class="panel"><button class="button button-small" id="new">+ مقال جديد</button><div id="articles-list"></div></aside><section class="panel"><h2 id="editor-title">مقال جديد</h2><form id="edit-form">
<label>العنوان<input id="title" maxlength="160" required></label><label>الرابط المختصر (إنجليزي)<input id="slug" dir="ltr" maxlength="120" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" required></label><label>الملخص<textarea id="excerpt" required maxlength="500" rows="3"></textarea></label><label>التصنيف<select id="category"><option value="">بدون تصنيف</option></select></label>
<label>محتوى المقال (الفقرات تفصل بسطر فارغ)<textarea id="body" rows="13" required></textarea></label><label>رابط صورة الغلاف HTTPS<input id="cover" type="url" dir="ltr"></label><label>رابط فيديو YouTube<input id="video" type="url" dir="ltr"></label><label>عنوان SEO<input id="seo-title" maxlength="160"></label><label>وصف SEO<textarea id="seo-desc" maxlength="300" rows="2"></textarea></label><label>الحالة<select id="status"><option value="draft">مسودة</option><option value="published">منشور</option></select></label><div class="toolbar"><button class="button" type="submit">حفظ المقال</button><button class="button secondary" type="button" id="cancel">إلغاء</button></div>
</form></section></div></section></main><script src="../config/supabase.js"></script><script type="module" src="admin.js"></script></body></html>
